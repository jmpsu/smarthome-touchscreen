conversation:
  intents:
    HP1_turnon:
      - "turn on the {name}"
      - "Turn {name} on"
      - "light up the {name}"
      - "hit the {name}"
    HP2_turnoff:
      - "turn off the {name}"
      - "{name} off"
      - "kill the {name}"
      - "douse the {name}"
    HP3_brightness:
      - "set the {name} to {value} percent"
      - "dim the {name} to {value}"
      - "{name} at {value}"
    HP4_color:
      - "make the {name} {value}"
      - "turn the {name} {value}"
      - "{name} to {value}"
    HP5_scene:
      - "movie time"
      - "movie mode"
      - "theater mode"
    HP6_scene:
      - "good night"
      - "bedtime"
      - "lights out everywhere"
    HP7_mediaplay:
      - "play music"
      - "put on some music"
      - "start the tunes"
    HP8_mediapause:
      - "pause the music"
      - "stop the music"
      - "quiet"

intent_script:
  HP1_turnon:
    speech:
      text: "Okay"
    action:
      - service: light.turn_on
        target:
          entity_id: >-
            {% set n = name | lower %}
            {% set ents = states.light
                 | selectattr('name','search', n) | map(attribute='entity_id') | list %}
            {% set areas = areas() | select('search', n) | list %}
            {% if ents | count > 0 %}{{ ents }}
            {% else %}{{ areas | map('area_entities') | sum(start=[])
                 | select('search','^light\.') | list }}{% endif %}

  HP2_turnoff:
    speech:
      text: "Okay"
    action:
      - service: light.turn_off
        target:
          entity_id: >-
            {% set n = name | lower %}
            {% set ents = states.light
                 | selectattr('name','search', n) | map(attribute='entity_id') | list %}
            {% set areas = areas() | select('search', n) | list %}
            {% if ents | count > 0 %}{{ ents }}
            {% else %}{{ areas | map('area_entities') | sum(start=[])
                 | select('search','^light\.') | list }}{% endif %}

  HP3_brightness:
    speech:
      text: "Okay"
    action:
      - service: light.turn_on
        data:
          brightness_pct: "{{ value | int }}"
        target:
          entity_id: >-
            {% set n = name | lower %}
            {% set ents = states.light
                 | selectattr('name','search', n) | map(attribute='entity_id') | list %}
            {% set areas = areas() | select('search', n) | list %}
            {% if ents | count > 0 %}{{ ents }}
            {% else %}{{ areas | map('area_entities') | sum(start=[])
                 | select('search','^light\.') | list }}{% endif %}

  HP4_color:
    speech:
      text: "Okay"
    action:
      - service: light.turn_on
        data:
          color_name: "{{ value }}"
        target:
          entity_id: >-
            {% set n = name | lower %}
            {% set ents = states.light
                 | selectattr('name','search', n) | map(attribute='entity_id') | list %}
            {% set areas = areas() | select('search', n) | list %}
            {% if ents | count > 0 %}{{ ents }}
            {% else %}{{ areas | map('area_entities') | sum(start=[])
                 | select('search','^light\.') | list }}{% endif %}

  HP5_scene:
    speech:
      text: "Okay"
    action:
      - service: script.hp_scene_movie

  HP6_scene:
    speech:
      text: "Okay"
    action:
      - service: script.hp_scene_goodnight

  HP7_mediaplay:
    speech:
      text: "Okay"
    action:
      - service: media_player.media_play
        target:
          entity_id: media_player.kitchen_homepod

  HP8_mediapause:
    speech:
      text: "Okay"
    action:
      - service: media_player.media_pause
        target:
          entity_id: media_player.kitchen_homepod

# --- scene scripts -------------------------------------------------
script:
  hp_scene_movie:
    alias: "Movie"
    sequence:
      - service: light.turn_on
        data: {brightness_pct: 15, rgb_color: [90, 60, 200]}
        target: {entity_id: [light.couch, light.floor_light, light.couch_2, light.120v_a60_9w_smart_bulb, light.120v_a60_9w_smart_bulb_26]}
      - service: light.turn_off
        target: {entity_id: [light.kitchen_light_corner, light.kitchen_light_3, light.kitchen_light_fridge, light.laundry_room_light]}
      - service: light.turn_on
        data: {brightness_pct: 10}
        target: {entity_id: [light.hallway_light]}

  hp_scene_goodnight:
    alias: "Good Night"
    sequence:
      - service: light.turn_off
        target: {entity_id: [light.couch, light.kitchen_light_corner, light.bedroom_ceiling, light.kitchen_light_3, light.kitchen_light_fridge, light.hallway_light, light.guest_room, light.bathroom_shower_light, light.floor_light, light.laundry_room_light, light.couch_2, light.back_door, light.120v_a60_9w_smart_bulb, light.120v_a60_9w_smart_bulb_26]}

  hp_scene_evening:
    alias: "Evening"
    sequence:
      - service: light.turn_on
        data: {brightness_pct: 60, rgb_color: [255, 170, 90]}
        target: {entity_id: [light.couch, light.floor_light, light.couch_2, light.120v_a60_9w_smart_bulb, light.120v_a60_9w_smart_bulb_26]}
      - service: light.turn_on
        data: {brightness_pct: 70, rgb_color: [255, 200, 150]}
        target: {entity_id: [light.kitchen_light_corner, light.kitchen_light_3, light.kitchen_light_fridge, light.laundry_room_light]}

  hp_scene_bright:
    alias: "All Bright"
    sequence:
      - service: light.turn_on
        data: {brightness_pct: 100, rgb_color: [255, 224, 190]}
        target: {entity_id: [light.couch, light.kitchen_light_corner, light.bedroom_ceiling, light.kitchen_light_3, light.kitchen_light_fridge, light.hallway_light, light.guest_room, light.bathroom_shower_light, light.floor_light, light.laundry_room_light, light.couch_2, light.back_door, light.120v_a60_9w_smart_bulb, light.120v_a60_9w_smart_bulb_26]}

# --- Making Siri say your words ------------------------------------
# 1. Home app on iPhone: pair the Home Assistant HomeKit Bridge once.
#    Siri then controls every light by its own name on both HomePods.
# 2. For the custom wording above, open Shortcuts on iPhone:
#    New Shortcut > Home Assistant > Assist > type the phrase >
#    name the shortcut exactly what you want to say. Siri picks it up
#    everywhere, HomePods included. One shortcut per phrase you care about.