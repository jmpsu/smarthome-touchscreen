# =============================================================================
# Home Assistant — base configuration for the SmartHome Touchscreen panel
# -----------------------------------------------------------------------------
# This is intentionally minimal. Cloud/QR-based integrations (Tuya SmartLife,
# WiZ, Eufy) are added through the UI config-flow the first time HA boots; the
# setup wizard + docs/DEVICES.md walk the user through the one QR scan.
#
# What we DO declare in YAML:
#   * sane defaults + our timezone/location (from .env, injected at first boot)
#   * the HomeKit Bridge that re-exports every light/switch/camera/climate to
#     Apple Home + Siri (replicating the manual "Add HomeKit Bridge" steps)
#   * automatic discovery so LAN devices show up without manual entry
# =============================================================================

default_config:

# Load Lovelace in both UI and YAML mode so the dashboard can be customized.
lovelace:
  mode: auto-gen

homeassistant:
  # These are overwritten at first boot by set_secrets.py using .env values.
  name: Home
  latitude: !env_var LATITUDE 0
  longitude: !env_var LONGITUDE 0
  elevation: !env_var ELEVATION 0
  unit_system: us_customary
  time_zone: !env_var TIMEZONE UTC
  # Allow the dashboard container + kiosk browser to reach the API.
  auth_providers:
    - type: homeassistant

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - 172.16.0.0/12   # docker bridge network (dashboard container)
    - ::1

# --- Discovery ---------------------------------------------------------------
# These make Tuya-local, WiZ, Cast, and generic devices appear automatically.
zeroconf:
dhcp:
ssdp:

# --- Sun / moon / solunar helpers used by the rotating displays --------------
sun:

# --- Apple HomeKit Bridge ----------------------------------------------------
# Replicates the manual steps from the spec: Settings > Devices & Services >
# Add Integration > HomeKit Bridge, choosing light/switch/climate/camera. The
# PIN comes from .env (generated by the wizard) so the QR is stable.
homekit:
  - name: SmartHome Bridge
    port: 21063
    # With host networking HA auto-detects the LAN IP to advertise over mDNS,
    # so we don't pin advertise_ip here.
    filter:
      include_domains:
        - light
        - switch
        - climate
        - fan
        - cover
        - camera
        - lock
    entity_config: {}

# Automations / scenes are kept in their own files for easy editing.
automation: !include automations.yaml
scene: !include scenes.yaml
script: !include scripts.yaml

# Cameras (Eufy) are pulled from MediaMTX as generic streams — see cameras.yaml.
camera: !include cameras.yaml

logger:
  default: warning
