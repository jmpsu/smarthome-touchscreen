# Reverse proxy for panel.joeysvault.app -> the panel backend on 127.0.0.1:8000
#
# Install on the VPS as /etc/nginx/sites-available/smarthome-panel, then:
#   ln -sf /etc/nginx/sites-available/smarthome-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS is terminated by Cloudflare in front of this host. If you want an origin
# certificate too, run `certbot --nginx -d panel.joeysvault.app` afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name panel.joeysvault.app;

    # The dashboard holds a long-lived WebSocket to /ha-ws; do not let nginx
    # time it out at the default 60s.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}

# Requires this in the http{} block (Debian/Ubuntu: /etc/nginx/conf.d/upgrade.conf):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
