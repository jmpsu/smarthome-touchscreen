# Cloudflare Workers Configuration

name = "smart-home-panel"
type = "javascript"
compatibility_date = "2024-01-01"

# Default environment
env.production.name = "smart-home-panel-prod"
env.production.workers_dev = false

# KV Namespace (required for caching)
[[env.production.kv_namespaces]]
binding = "CACHE"
id = "your_kv_id_here"
preview_id = "your_kv_preview_id_here"

# Environment variables for all workers
[env.production.vars]
LOCATION_LAT = "40.7128"
LOCATION_LON = "-74.0060"
TIDE_STATION = "8454000"

# Secrets (set via: wrangler secret put SECRET_NAME)
# [env.production.secrets]
# TWITTER_BEARER_TOKEN = "your_token"
# SPOTIFY_CLIENT_ID = "your_client_id"
# SPOTIFY_CLIENT_SECRET = "your_client_secret"
